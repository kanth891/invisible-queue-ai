services:
  # ── Frontend Static Site ──────────────────────────────
  - type: static
    name: invisible-queue-ai-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback: Rewrite all routes to /index.html for React Router
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend API Web Service ───────────────────────────
  - type: web
    name: invisible-queue-ai-backend
    env: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # ── ML Prediction Microservice ────────────────────────
  - type: web
    name: invisible-queue-ai-ml
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PORT
        value: 8000
